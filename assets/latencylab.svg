<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LatencyLab">
  <defs>
    <linearGradient id="ll-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4059cc"/>
      <stop offset="1" stop-color="#2d3f8f"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#ll-tile)"/>
  <!-- The glyph is balanced in the tile: its ink runs from y=7 (crown top) to
       y=57 (case outer edge, allowing for the 4px stroke), leaving 7px clear at
       the top and 7px at the base. The case must not approach y=60 or lower,
       where the tile's own 14px corner radius is already curving inward and the
       circle reads as clipped. -->
  <!-- crown / top button -->
  <rect x="27" y="7" width="10" height="6" rx="2" fill="#e4502a"/>
  <rect x="30" y="12" width="4" height="5" rx="1.5" fill="#e4502a"/>
  <!-- outer case -->
  <circle cx="32" cy="36" r="19" fill="none" stroke="#e4502a" stroke-width="4"/>
  <!-- tick marks -->
  <g stroke="#eef2fb" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="32" y1="20" x2="32" y2="23.5"/>
    <line x1="32" y1="48.5" x2="32" y2="52"/>
    <line x1="16" y1="36" x2="19.5" y2="36"/>
    <line x1="44.5" y1="36" x2="48" y2="36"/>
  </g>
  <!-- hands: banana, the same as the application's own mark, and the case is
       the same warm amber. The tile is the cool royal blue the application
       fills its buttons with, so the mark is warm against it here exactly as it
       is in the toolbar: the two drawings say the same thing, and neither can
       lose its case by matching the surface behind it. The ticks stay
       near-white, being structure rather than the thing being read. -->
  <line x1="32" y1="36" x2="42.5" y2="26.5" stroke="#ffe135" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="32" y2="25.5" stroke="#ffe135" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="3.4" fill="#ffe135"/>
</svg>
