<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="LatencyLab">
  <defs>
    <linearGradient id="ll-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a63d2"/>
      <stop offset="1" stop-color="#6d47b3"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#ll-tile)"/>
  <!-- The glyph is balanced in the tile: its ink runs from y=7 (crown top) to
       y=57 (case outer edge, allowing for the 4px stroke), leaving 7px clear at
       the top and 7px at the base. The case must not approach y=60 or lower,
       where the tile's own 14px corner radius is already curving inward and the
       circle reads as clipped. -->
  <!-- crown / top button -->
  <rect x="27" y="7" width="10" height="6" rx="2" fill="#e9e2f7"/>
  <rect x="30" y="12" width="4" height="5" rx="1.5" fill="#e9e2f7"/>
  <!-- outer case -->
  <circle cx="32" cy="36" r="19" fill="none" stroke="#f3eefb" stroke-width="4"/>
  <!-- tick marks -->
  <g stroke="#f3eefb" stroke-width="2" stroke-linecap="round" opacity="0.75">
    <line x1="32" y1="20" x2="32" y2="23.5"/>
    <line x1="32" y1="48.5" x2="32" y2="52"/>
    <line x1="16" y1="36" x2="19.5" y2="36"/>
    <line x1="44.5" y1="36" x2="48" y2="36"/>
  </g>
  <!-- hands -->
  <line x1="32" y1="36" x2="42.5" y2="26.5" stroke="#26a69a" stroke-width="3" stroke-linecap="round"/>
  <line x1="32" y1="36" x2="32" y2="25.5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="36" r="3.4" fill="#ffffff"/>
</svg>
